<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1316">
<title>Die Line Scanner</title>
<style>
/* Layout: the camera fills the screen. Verdict floats on top, one slider and two buttons sit at the bottom. */
/* A camera screen is dark by nature, so this page commits to one dark look. */
:root {
  --bg: #0b0e10; --surface: #1a2025; --fg: #f1f4f6; --muted: #a3afb9; --line: #2c353d;
  --accent: #3bb4c8; --accent-fg: #06171b; --ok: #4cc46f; --bad: #ff6b57; --warn: #e0a64a;
  --font: -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; background: var(--bg); }
body { background: var(--bg); color: var(--fg); font: 16px/1.4 var(--font); margin: 0;
       height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.stage { position: relative; flex: 1; min-height: 0; background: #000; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; touch-action: none; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: var(--muted); text-align: center; }
.top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
       padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
       background: linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,0)); pointer-events: none; }
#verdict { font-size: 22px; font-weight: 700; text-wrap: balance; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
#score { color: #d5dce2; font-size: 14px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,0,0,.6); white-space: nowrap; }
.chip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(46px + env(safe-area-inset-top, 0px));
        flex: none; min-height: 36px; padding: 4px 12px; font-size: 13px; font-weight: 600; background: rgba(0,0,0,.55); border-color: rgba(255,255,255,.25); }
#hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: 10px; margin: 0;
        padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.7); font-size: 14px; }
#hint.warn { color: var(--warn); }
.bar { background: var(--surface); border-top: 1px solid var(--line); display: grid; gap: 10px;
       padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.slider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
input[type=range] { width: 100%; min-width: 0; accent-color: var(--accent); margin: 0; }
.btns { display: flex; gap: 8px; }
button { flex: 1; min-height: 48px; border-radius: 10px; padding: 8px 10px; font: inherit; font-weight: 600;
         border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; touch-action: manipulation;
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: transform 100ms ease-out; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); flex: 1.4; }
button:active { transform: scale(.97); }
button:disabled { opacity: .5; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<div class="stage">
  <canvas id="view" hidden></canvas>
  <div class="empty" id="empty">Starting the camera...</div>
  <div class="top"><span id="verdict"></span><span id="score"></span></div>
  <button id="angle" class="chip">Lines: auto</button>
  <p id="hint" hidden></p>
</div>
<div class="bar">
  <div class="slider">
    <span>Less strict</span>
    <input id="sens" type="range" min="1" max="10" step="0.5" value="4" aria-label="Sensitivity">
    <span>More strict</span>
  </div>
  <div class="btns">
    <button id="main" class="primary">Capture</button>
    <button id="depth">Depth check</button>
    <button id="send" hidden>Send to Claude</button>
  </div>
</div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<script>
// Die line analysis. Pure functions, no DOM, so they can be tested in Node.
//
// The whole picture is scanned. It is turned so the lines run left to right
// (a "field"), then each pixel gets a signed line signal.
(function (root) {
  'use strict';

  const BINS = 512;
  const MAX_CONTRAST = 0.5;   // contrast above this counts as 0.5
  const TOP_FRACTION = 0.10;  // the score is the mean of the strongest 10% of pixels
  const EDGE_LIMIT = 0.07;    // a brightness step bigger than this across a few pixels is an edge, not a line
  const DARK = 10, BRIGHT = 245;

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  function toGray(rgba, count) {
    const g = new Uint8ClampedArray(count);
    for (let i = 0, p = 0; i < count; i++, p += 4) g[i] = (rgba[p] * 77 + rgba[p + 1] * 150 + rgba[p + 2] * 29) >> 8;
    return g;
  }

  // Turn the whole picture by theta radians so lines run left to right.
  // Returns the turned picture (field) and a mask of which pixels came from inside the picture.
  // scale < 1 shrinks it to stay under maxPixels.
  function sampleRect(gray, w, h, theta, maxPixels) {
    const c = Math.cos(theta), s = Math.sin(theta);
    const bw = Math.abs(w * c) + Math.abs(h * s), bh = Math.abs(w * s) + Math.abs(h * c);
    const scale = Math.min(1, Math.sqrt(maxPixels / (bw * bh)));
    const nw = Math.max(16, Math.round(bw * scale)), nh = Math.max(16, Math.round(bh * scale));
    const field = new Float32Array(nw * nh), inside = new Uint8Array(nw * nh);
    const step = 1 / scale, cx = w / 2, cy = h / 2;
    let k = 0;
    for (let j = 0; j < nh; j++) {
      const v = (j + 0.5 - nh / 2) * step;
      for (let i = 0; i < nw; i++, k++) {
        const u = (i + 0.5 - nw / 2) * step;
        const px = cx + u * c - v * s, py = cy + u * s + v * c;
        inside[k] = px >= 0 && px < w && py >= 0 && py < h ? 1 : 0;
        const x = clamp(px - 0.5, 0, w - 1.001), y = clamp(py - 0.5, 0, h - 1.001);
        const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, p = y0 * w + x0;
        field[k] = (gray[p] * (1 - fx) + gray[p + 1] * fx) * (1 - fy) + (gray[p + w] * (1 - fx) + gray[p + w + 1] * fx) * fy;
      }
    }
    return { field, inside, nw, nh, scale };
  }

  // The direction the lines run, from the picture's overall grain, as radians in [0, PI).
  // coherence is 0 for random texture and near 1 for clear parallel lines.
  function dominantAngle(gray, w, h) {
    const CAP = 120, FLOOR = 10;   // Sobel gradients are 4 times a plain difference
    // Remove slow brightness change first (light falloff, shading) so only fine detail is left.
    // Otherwise a lighting gradient across the part outvotes the lines and gives the wrong direction.
    const tmp = new Float32Array(w * h), fine = new Float32Array(w * h);
    blurRows(gray, tmp, w, h, 9);
    for (let i = 0; i < w; i++) {   // vertical box blur of tmp into fine, then subtract
      let sum = 0, cnt = 0;
      for (let j = 0; j < Math.min(4, h); j++) { sum += tmp[j * w + i]; cnt++; }
      for (let j = 0; j < h; j++) {
        const add = j + 4, rem = j - 5;
        if (add < h) { sum += tmp[add * w + i]; cnt++; }
        if (rem >= 0) { sum -= tmp[rem * w + i]; cnt--; }
        fine[j * w + i] = gray[j * w + i] - sum / cnt;
      }
    }
    let sxx = 0, sxy = 0, total = 0;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        let gx = fine[i - w + 1] + 2 * fine[i + 1] + fine[i + w + 1] - fine[i - w - 1] - 2 * fine[i - 1] - fine[i + w - 1];
        let gy = fine[i + w - 1] + 2 * fine[i + w] + fine[i + w + 1] - fine[i - w - 1] - 2 * fine[i - w] - fine[i - w + 1];
        const mag = Math.sqrt(gx * gx + gy * gy);
        if (mag < FLOOR) continue;
        if (mag > CAP) { gx *= CAP / mag; gy *= CAP / mag; }   // so one big edge cannot outvote the fine lines
        sxx += gx * gx - gy * gy; sxy += 2 * gx * gy; total += gx * gx + gy * gy;
      }
    }
    if (!total) return { theta: 0, deg: 0, coherence: 0 };
    const gradient = 0.5 * Math.atan2(sxy, sxx);            // direction the brightness changes fastest
    const theta = (gradient + Math.PI / 2 + Math.PI) % Math.PI;   // lines run at right angles to that
    return { theta, deg: theta * 180 / Math.PI, coherence: Math.sqrt(sxx * sxx + sxy * sxy) / total };
  }

  function blurRows(src, dst, nw, nh, len) {
    const half = len >> 1;
    for (let j = 0; j < nh; j++) {
      const base = j * nw;
      let sum = 0, cnt = 0;
      for (let i = 0; i < Math.min(half, nw); i++) { sum += src[base + i]; cnt++; }
      for (let i = 0; i < nw; i++) {
        const add = i + half, rem = i - half - 1;
        if (add < nw) { sum += src[base + add]; cnt++; }
        if (rem >= 0) { sum -= src[base + rem]; cnt--; }
        dst[base + i] = sum / cnt;
      }
    }
  }

  // Mean of the strongest `frac` of |values| over the valid pixels.
  function topMean(values, valid, frac) {
    const cnt = new Uint32Array(BINS), sum = new Float64Array(BINS);
    let total = 0;
    for (let i = 0; i < values.length; i++) {
      if (!valid[i]) continue;
      let v = Math.abs(values[i]);
      if (v > MAX_CONTRAST - 1e-6) v = MAX_CONTRAST - 1e-6;
      const b = (v / MAX_CONTRAST * BINS) | 0;
      cnt[b]++; sum[b] += v; total++;
    }
    if (!total) return 0;
    const need = Math.max(1, Math.ceil(total * frac));
    let acc = 0, taken = 0;
    for (let b = BINS - 1; b >= 0 && taken < need; b--) {
      if (!cnt[b]) continue;
      const take = Math.min(cnt[b], need - taken);
      acc += sum[b] * take / cnt[b];
      taken += take;
    }
    return acc / taken;
  }

  // field: nw*nh brightness values with lines running left to right. inside: 1 where the pixel is real picture.
  // Returns { score, contrast, valid, coverage }.
  //   contrast: signed line signal per pixel, as a fraction of local brightness.
  //   valid:    1 where the pixel counts. Edges, glare, deep shadow and borders are 0.
  //   score:    strength of the strongest lines, as a fraction (0.02 = 2%).
  //   coverage: share of the real picture that counted.
  function analyseField(field, nw, nh, opts, inside) {
    const o = Object.assign({
      along: clamp(Math.round(nh * 0.05), 9, 41),    // how far to average along a line (keeps long streaks, drops noise)
      across: clamp(Math.round(nh * 0.012), 2, 8),   // how far to compare across lines
    }, opts);
    const k = o.across, k2 = Math.max(4, k * 2), L = o.along;

    const smooth = new Float32Array(nw * nh);
    blurRows(field, smooth, nw, nh, L);

    const contrast = new Float32Array(nw * nh);
    const bad = new Uint8Array(nw * nh);
    const P = new Float64Array(nh + 1);
    const edge = new Uint8Array(nh);

    for (let i = 0; i < nw; i++) {
      P[0] = 0;
      for (let j = 0; j < nh; j++) P[j + 1] = P[j] + smooth[j * nw + i];
      edge.fill(0);
      for (let j = 0; j < nh; j++) {
        const a = Math.max(0, j - k), b = Math.min(nh, j + k + 1);
        const local = (P[b] - P[a]) / (b - a);
        const idx = j * nw + i;
        contrast[idx] = (smooth[idx] - local) / (local + 8);
        if (local < DARK || local > BRIGHT) bad[idx] = 1;

        // Edge test: compare the mean over a band below with the mean over a band above, skipping the few
        // pixels next to this one. A thin line sits in the gap and does not count. A wide step does.
        const gap = k + 2, wide = k * 3 + 4;
        const b0 = Math.min(nh, j + gap), b1 = Math.min(nh, j + gap + wide), a0 = Math.max(0, j - gap - wide), a1 = Math.max(0, j - gap + 1);
        if (b1 > b0 && a1 > a0) {
          const below = (P[b1] - P[b0]) / (b1 - b0), above = (P[a1] - P[a0]) / (a1 - a0);
          if (Math.abs(below - above) / (local + 8) > EDGE_LIMIT) edge[j] = 1;
        }
      }
      for (let j = 0; j < nh; j++) {
        if (!edge[j]) continue;
        for (let t = Math.max(0, j - k); t <= Math.min(nh - 1, j + k); t++) bad[t * nw + i] = 1;
      }
    }

    // Borders, where the averaging windows are cut short, and anything outside the real picture.
    const mx = L >> 1, my = k2;
    const valid = new Uint8Array(nw * nh);
    let validCount = 0, insideCount = 0;
    for (let j = 0; j < nh; j++) {
      for (let i = 0; i < nw; i++) {
        const idx = j * nw + i;
        const real = inside ? inside[idx] : 1;
        insideCount += real;
        if (!real || i < mx || i >= nw - mx || j < my || j >= nh - my || bad[idx]) continue;
        valid[idx] = 1; validCount++;
      }
    }
    const coverage = insideCount ? validCount / insideCount : 0;
    return { score: coverage < 0.05 ? 0 : topMean(contrast, valid, TOP_FRACTION), contrast, valid, coverage };
  }

  // Try each candidate direction on the real line analysis and keep the one that finds the strongest lines.
  // The right direction scores high because the lines add up along it. At right angles they average out.
  function bestOrientation(gray, w, h, thetas, maxPixels) {
    let best = null;
    for (const theta of thetas) {
      const f = sampleRect(gray, w, h, theta, maxPixels);
      const r = analyseField(f.field, f.nw, f.nh, undefined, f.inside);
      if (!best || r.score > best.r.score) best = { theta, f, r };
    }
    return best;
  }

  // Two photos of the same spot with the light from opposite sides.
  // A groove flips its shading when the light flips. A stain or print does not.
  function depth(a, b) {
    const n = a.contrast.length;
    const relief = new Float32Array(n), stain = new Float32Array(n), valid = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      valid[i] = a.valid[i] & b.valid[i];
      relief[i] = (a.contrast[i] - b.contrast[i]) / 2;
      stain[i] = (a.contrast[i] + b.contrast[i]) / 2;
    }
    const reliefScore = topMean(relief, valid, TOP_FRACTION);
    const stainScore = topMean(stain, valid, TOP_FRACTION);
    return { relief, stain, valid, reliefScore, stainScore,
      grooveShare: reliefScore / (reliefScore + stainScore + 1e-9) };
  }

  const api = { toGray, sampleRect, dominantAngle, bestOrientation, analyseField, depth };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Scan = api;
})(typeof self !== 'undefined' ? self : this);

(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const view = $('view'), vctx = view.getContext('2d');
  const LIVE_W = 512, LIVE_PIXELS = 330000, STILL_MAX_W = 1600, STILL_PIXELS = 2000000;
  const ORIENT_PIXELS = 120000;   // smaller size used to compare candidate directions quickly
  const VIEW_FULL = 0.015;        // line contrast (1.5% of brightness) that shows as full red
  const work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently: true });
  const ovl = document.createElement('canvas'), octx = ovl.getContext('2d');
  const video = document.createElement('video');
  video.muted = true; video.playsInline = true; video.setAttribute('playsinline', '');

  const S = {
    cam: false, mode: 'live',                 // live | still | depth
    angleMode: 'auto', haveAngle: false, theta: 0,   // line direction: auto, or 0 / PI/2 set by hand
    still: null, shotA: null, shotB: null, step: 0,   // step: 0 normal, 1 and 2 = depth check shots
    scores: [], last: 0, lastAngle: -1e9, render: null, pending: null, assets: null,
  };

  // The one slider. Higher means stricter: a lower line score is enough to flag.
  const limit = () => 12 / +$('sens').value;     // in percent

  function hint(text, warn) {
    $('hint').hidden = !text; $('hint').textContent = text || ''; $('hint').classList.toggle('warn', !!warn);
  }

  // ---- pictures -------------------------------------------------------------------------

  function makeShot(source, sw, sh) {
    const scale = Math.min(1, STILL_MAX_W / sw), w = Math.round(sw * scale), h = Math.round(sh * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const c = canvas.getContext('2d', { willReadFrequently: true });
    c.drawImage(source, 0, 0, w, h);
    return { canvas, w, h, gray: Scan.toGray(c.getImageData(0, 0, w, h).data, w * h) };
  }

  async function shotFromFile(file) {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) {
      bmp = await new Promise((ok, fail) => {
        const im = new Image(), u = URL.createObjectURL(file);
        im.onload = () => { URL.revokeObjectURL(u); ok(im); };
        im.onerror = () => fail(new Error('That photo could not be read.'));
        im.src = u;
      });
    }
    return makeShot(bmp, bmp.width, bmp.height);
  }

  // A new picture: a frame from the camera, or a photo from the phone's camera app.
  function acquire() {
    if (S.cam) return Promise.resolve(makeShot(video, video.videoWidth, video.videoHeight));
    return new Promise((resolve) => { S.pending = resolve; $('cam').click(); });
  }

  // ---- analysis -------------------------------------------------------------------------

  // Pick the line direction. The grain of the picture gives a first guess. Then every candidate is run through
  // the real line analysis and the one that finds the strongest lines wins, so a wrong guess gets corrected.
  // Returns that winning analysis, or null when the direction was set by hand.
  function orient(gray, w, h, pixels) {
    if (S.angleMode !== 'auto') { S.theta = S.angleMode; return null; }
    const a = Scan.dominantAngle(gray, w, h);
    const cands = [a.theta, (a.theta + Math.PI / 2) % Math.PI];
    if (a.coherence < 0.15) cands.push(0, Math.PI / 2);
    if (S.haveAngle) cands.unshift(S.theta);     // first, so it wins ties and the picture stays steady
    const best = Scan.bestOrientation(gray, w, h, cands, pixels);
    S.theta = best.theta; S.haveAngle = true;
    return best;
  }

  function scan(gray, w, h, pixels) {
    const f = Scan.sampleRect(gray, w, h, S.theta, pixels);
    const r = Scan.analyseField(f.field, f.nw, f.nh, undefined, f.inside);
    return { f, r };
  }

  // ---- drawing --------------------------------------------------------------------------

  function paint(R) {
    const { source, w, h, f, contrast, valid } = R;
    if (view.width !== w || view.height !== h) { view.width = w; view.height = h; }
    vctx.drawImage(source, 0, 0, w, h);
    vctx.fillStyle = 'rgba(0,0,0,0.35)'; vctx.fillRect(0, 0, w, h);   // dim the picture so the red lines stand out
    if (ovl.width !== f.nw || ovl.height !== f.nh) { ovl.width = f.nw; ovl.height = f.nh; }
    // The red is a fixed, generous view of where the lines are. It does not depend on the slider.
    const img = octx.createImageData(f.nw, f.nh), d = img.data;
    for (let i = 0, p = 0; i < f.inside.length; i++, p += 4) {
      if (!f.inside[i]) continue;
      if (!valid[i]) { d[p] = 70; d[p + 1] = 120; d[p + 2] = 255; d[p + 3] = 28; continue; }   // ignored: edge, glare or shadow
      const s = Math.min(1, Math.abs(contrast[i]) / VIEW_FULL);
      if (s > 0.1) { d[p] = 255; d[p + 1] = 40; d[p + 2] = 30; d[p + 3] = s * 235; }
    }
    octx.putImageData(img, 0, 0);
    vctx.save();
    vctx.translate(w / 2, h / 2); vctx.rotate(R.theta);
    vctx.drawImage(ovl, -f.nw / (2 * f.scale), -f.nh / (2 * f.scale), f.nw / f.scale, f.nh / f.scale);
    vctx.restore();
  }

  function verdict(text, colour, scoreText) {
    $('verdict').textContent = text; $('verdict').style.color = colour; $('score').textContent = scoreText || '';
  }

  function show(R) {
    S.render = R;
    paint(R);
    const lim = limit();
    if (R.kind === 'depth') {
      const rel = R.depth.reliefScore * 100, stn = R.depth.stainScore * 100;
      const text = rel > lim ? 'Cut into the surface' : stn > lim ? 'Surface marks only' : 'Looks clean';
      verdict(text, rel > lim ? 'var(--bad)' : stn > lim ? 'var(--warn)' : 'var(--ok)',
        'Depth ' + rel.toFixed(1) + '%  Marks ' + stn.toFixed(1) + '%');
      if (!S.step) hint('Red = lines that flipped with the light, so they have depth.');
    } else {
      const sc = R.score * 100, bad = sc > lim;
      verdict(bad ? 'Die lines likely' : 'Looks clean', bad ? 'var(--bad)' : 'var(--ok)', 'Score ' + sc.toFixed(1) + '% / ' + lim.toFixed(1) + '%');
      if (!S.step) hint(R.coverage < 0.25 ? 'Most of the picture is edge, glare or shadow (blue). Move closer to a flat face.' : '', true);
    }
    $('send').disabled = false;
  }

  function updateButtons() {
    $('main').textContent = S.step ? 'Shot ' + S.step + ' of 2'
      : S.cam ? (S.mode === 'live' ? 'Capture' : 'Back to live') : 'Take photo';
    $('depth').textContent = S.step ? 'Cancel' : 'Depth check';
  }

  // ---- live camera ----------------------------------------------------------------------

  function tick(t) {
    requestAnimationFrame(tick);
    if (S.mode !== 'live' || !video.videoWidth || t - S.last < 80) return;
    S.last = t;
    const h = Math.round(LIVE_W * video.videoHeight / video.videoWidth);
    if (work.width !== LIVE_W || work.height !== h) { work.width = LIVE_W; work.height = h; }
    wctx.drawImage(video, 0, 0, LIVE_W, h);
    const gray = Scan.toGray(wctx.getImageData(0, 0, LIVE_W, h).data, LIVE_W * h);
    if (t - S.lastAngle > 500) { orient(gray, LIVE_W, h, ORIENT_PIXELS); S.lastAngle = t; }
    else if (S.angleMode !== 'auto') S.theta = S.angleMode;
    const { f, r } = scan(gray, LIVE_W, h, LIVE_PIXELS);
    S.scores.push(r.score); if (S.scores.length > 5) S.scores.shift();
    const score = [...S.scores].sort((a, b) => a - b)[S.scores.length >> 1];
    show({ kind: 'line', source: work, w: LIVE_W, h, f, theta: S.theta, contrast: r.contrast, valid: r.valid, score, coverage: r.coverage });
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    video.srcObject = stream;
    await video.play();
    S.cam = true;
  }

  function noCamera(reason) {
    S.cam = false; S.mode = 'still';
    updateButtons();
    if (S.render) return;   // a photo was already taken while the camera request was pending: keep its result
    $('empty').textContent = reason; $('empty').hidden = false;
    verdict('Take a photo to start', 'var(--fg)', '');
  }

  // ---- actions --------------------------------------------------------------------------

  function useShot(shot) {
    $('empty').hidden = true; view.hidden = false;
    S.still = shot; S.shotB = null; S.mode = 'still';
    const best = orient(shot.gray, shot.w, shot.h, STILL_PIXELS);
    const { f, r } = best || scan(shot.gray, shot.w, shot.h, STILL_PIXELS);
    show({ kind: 'line', source: shot.canvas, w: shot.w, h: shot.h, f, theta: S.theta, contrast: r.contrast, valid: r.valid, score: r.score, coverage: r.coverage });
    updateButtons();
  }

  function finishDepth(a, b) {
    if (a.w !== b.w || a.h !== b.h) { hint('The two photos are different sizes. Take both again.', true); S.step = 0; updateButtons(); return; }
    const best = orient(a.gray, a.w, a.h, STILL_PIXELS);
    const A = best ? { f: best.f, r: best.r } : scan(a.gray, a.w, a.h, STILL_PIXELS), B = scan(b.gray, b.w, b.h, STILL_PIXELS);
    const d = Scan.depth(A.r, B.r);
    S.mode = 'depth'; S.step = 0; S.still = a; S.shotB = b;
    show({ kind: 'depth', source: a.canvas, w: a.w, h: a.h, f: A.f, theta: S.theta, contrast: d.relief, valid: d.valid, depth: d });
    updateButtons();
  }

  async function onMain() {
    if (!S.step && S.cam && S.mode !== 'live') { S.mode = 'live'; S.scores = []; S.still = S.shotB = null; hint(''); updateButtons(); return; }
    const shot = await acquire();
    $('empty').hidden = true; view.hidden = false;
    if (S.step === 1) {
      S.shotA = shot; S.step = 2; updateButtons();
      hint('Now light from the opposite side. Keep the phone still, then tap Shot 2.');
    } else if (S.step === 2) { finishDepth(S.shotA, shot); }
    else useShot(shot);
  }

  function onDepth() {
    if (S.step) { S.step = 0; hint(''); updateButtons(); return; }
    S.step = 1; S.shotA = null;
    if (S.cam) S.mode = 'live';
    updateButtons();
    hint('Hold still on one spot with light from one side, across the lines. Tap Shot 1.');
  }

  // ---- upload to Claude (only in the claude.ai version) ----------------------------------

  const blobOf = (canvas) => new Promise((ok) => canvas.toBlob(ok, 'image/jpeg', 0.92));

  async function sendToClaude() {
    if (!S.assets || !S.render) return;
    $('send').disabled = true; hint('Sending...');
    try {
      const canvases = S.mode === 'depth' ? [S.still.canvas, S.shotB.canvas] : [S.still ? S.still.canvas : work];
      canvases.push(view);
      for (const c of canvases) await S.assets.upload(await blobOf(c));
      hint('Sent ' + canvases.length + ' pictures. Tell Claude they are there.');
    } catch (e) { hint('Could not send: ' + (e && e.message ? e.message : 'try again'), true); }
    $('send').disabled = false;
  }

  // ---- wiring ---------------------------------------------------------------------------

  $('cam').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    shotFromFile(f).then((shot) => {
      if (S.pending) { const p = S.pending; S.pending = null; p(shot); } else useShot(shot);
    }).catch((err) => hint(err.message, true));
  });
  $('main').onclick = () => onMain().catch((err) => hint(err.message, true));
  $('depth').onclick = onDepth;
  $('send').onclick = sendToClaude;
  // Safety valve if the automatic direction is ever wrong: auto, then sideways, then up and down.
  $('angle').onclick = () => {
    S.angleMode = S.angleMode === 'auto' ? 0 : S.angleMode === 0 ? Math.PI / 2 : 'auto';
    $('angle').textContent = 'Lines: ' + (S.angleMode === 'auto' ? 'auto' : S.angleMode === 0 ? 'sideways' : 'up and down');
    if (S.mode === 'depth' && S.still && S.shotB) finishDepth(S.still, S.shotB);
    else if (S.mode === 'still' && S.still) useShot(S.still);
  };
  $('sens').addEventListener('input', () => { if (S.mode !== 'live' && S.render) show(S.render); });

  (async () => {
    try {
      if (window.claude && window.claude.use) {
        const assets = await window.claude.use('assets');
        if (assets) { S.assets = assets; $('send').hidden = false; $('send').disabled = true; }
      }
    } catch (e) { /* uploads are optional */ }
  })();
  updateButtons();
  startCamera().then(() => {
    $('empty').hidden = true; view.hidden = false; S.mode = 'live'; updateButtons();
    requestAnimationFrame(tick);
  }).catch((e) => noCamera(e && e.name === 'NotAllowedError'
    ? 'Camera is not allowed here. Use Take photo instead.' : 'No live camera here. Use Take photo instead.'));
})();
</script>
</body>
</html>
